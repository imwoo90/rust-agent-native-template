[template]
cargo_generate_version = ">=0.18.0"
include = [
    "Cargo.toml",
    "build.rs",
    "build_linter.rs",
    ".agent-lint.toml",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "README.md",
    "LICENSE",
    ".gitignore",
    ".cursor/**",
    ".github/**",
    "src/**",
    "tests/**",
    "scripts/**"
]
exclude = [
    "target/**",
    "Cargo.lock"
]

[hooks]
post = ["scripts/post.rhai"]

[placeholders]
description = { type = "string", prompt = "Project description:", default = "An Agent-Native Rust project with compile-time linting and living LLM-Wiki." }

[placeholders.agent]
type = "string"
prompt = "Target AI Agent instructions to include:"
choices = ["all", "claude", "cursor", "gemini", "copilot", "universal"]
default = "all"

[placeholders.clean]
type = "bool"
prompt = "Initialize with pristine empty scaffold (remove calculator demo)?:"
default = false
